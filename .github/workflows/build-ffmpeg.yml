name: Build ffmpeg

# Builds lean, self-contained ffmpeg executables from source with vcpkg
# (build/build-ffmpeg.py; features and pinned vcpkg baseline in
# build/vcpkg/vcpkg.json, link settings in build/vcpkg/triplets/), natively on
# each platform, then smoke-tests and checks them. Optionally opens a pull
# request adding them to ffmpeg/, or creates a draft release.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: >-
          "all", or comma-separated: linux-x86_64, linux-aarch64, macos-x86_64,
          macos-aarch64, win-i686, win-x86_64, win-aarch64
        default: all
      publish:
        description: What to do with the binaries
        type: choice
        options: [none, draft-release, pull-request]
        default: none

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          all='[
            {"platform": "linux-x86_64", "runner": "ubuntu-24.04"},
            {"platform": "linux-aarch64", "runner": "ubuntu-24.04-arm"},
            {"platform": "macos-x86_64", "runner": "macos-15-intel"},
            {"platform": "macos-aarch64", "runner": "macos-15"},
            {"platform": "win-i686", "runner": "windows-2025"},
            {"platform": "win-x86_64", "runner": "windows-2025"},
            {"platform": "win-aarch64", "runner": "windows-11-arm"}
          ]'
          include=$(jq -c --arg p "$PLATFORMS" '($p | gsub(" "; "") | split(",")) as $want
            | [.[] | select($p == "all" or (.platform as $x | $want | index($x)))]' <<< "$all")
          if [[ "$include" == "[]" ]]; then
            echo "::error::No known platform in '$PLATFORMS'"
            exit 1
          fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    env:
      # Inside the Linux container these are passed as /work/_build/...
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/_build/bincache
      VCPKG_DOWNLOADS: ${{ github.workspace }}/_build/downloads
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /build/
            /images/cockatoo.mp4

      # vcpkg's binary cache: libraries whose port, triplet and compiler are
      # unchanged are not rebuilt. Saved even if the build fails.
      - uses: actions/cache/restore@v4
        with:
          path: |
            _build/bincache
            _build/downloads
          key: vcpkg-${{ matrix.platform }}-${{ hashFiles('build/vcpkg/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ matrix.platform }}-${{ hashFiles('build/vcpkg/**') }}-
            vcpkg-${{ matrix.platform }}-

      - name: Build (Alpine container)
        if: runner.os == 'Linux'
        # Pass the job summary file into the container so the script can write to it.
        run: >
          docker run --rm -v "$PWD:/work" -w /work
          -e GITHUB_ACTIONS -e GITHUB_STEP_SUMMARY=/github/step_summary
          -v "$GITHUB_STEP_SUMMARY:/github/step_summary"
          -e VCPKG_DEFAULT_BINARY_CACHE=/work/_build/bincache -e VCPKG_DOWNLOADS=/work/_build/downloads
          alpine:3.24 sh -c 'apk add -q python3 && python3 build/build-ffmpeg.py --install-tools'

      - uses: actions/setup-python@v6
        if: runner.os != 'Linux'
        with:
          python-version: "3.x"

      - name: Build
        if: runner.os != 'Linux'
        run: python build/build-ffmpeg.py --platform ${{ matrix.platform }} --install-tools

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            _build/bincache
            _build/downloads
          key: vcpkg-${{ matrix.platform }}-${{ hashFiles('build/vcpkg/**') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vcpkg-logs-${{ matrix.platform }}
          path: |
            _build/${{ matrix.platform }}/buildtrees/**/*.log
            _build/${{ matrix.platform }}/buildtrees/**/config.log
          if-no-files-found: ignore

      - name: Test
        env:
          TEST_NAME: Smoke test on ${{ matrix.runner }}
          # GPU encoders cannot run on the runners; only check they are present.
          ENCODERS: >-
            libx264 libx265 libvpx-vp9 libaom-av1 libtheora libwebp hap libmp3lame libopus libvorbis
            libspeex libgsm libopencore_amrnb libvo_amrwbenc
            ${{ matrix.platform != 'win-i686' && 'libsvtav1' || '' }}
            ${{ matrix.platform == 'win-x86_64' && 'h264_nvenc hevc_nvenc h264_amf h264_qsv' || '' }}
          FILTERS: zscale vidstabdetect vidstabtransform drawtext
          PROTOCOLS: >-
            https srt sftp rtmpe rtmpte
            ${{ startsWith(matrix.platform, 'linux-') && 'sctp' || '' }}
        run: |
          read -ra encoders <<< "$ENCODERS"
          for exe in _out/ffmpeg-${{ matrix.platform }}-v*; do
            if [[ "$exe" == *.txt ]]; then continue; fi
            bash build/test-ffmpeg.sh "$exe" "${encoders[@]}"
            filters="$("$exe" -hide_banner -filters)"
            protocols="$("$exe" -hide_banner -protocols)"
            for f in $FILTERS; do
              if ! grep -qE "^ [^ ]+ $f " <<< "$filters"; then
                echo "::error::$exe has no $f filter"
                exit 1
              fi
            done
            for p in $PROTOCOLS; do
              if ! grep -qx "  $p" <<< "$protocols"; then
                echo "::error::$exe has no $p protocol"
                exit 1
              fi
            done
          done

      - name: Test on musl (Alpine)
        if: runner.os == 'Linux'
        run: >
          docker run --rm -v "$PWD:/work" -w /work
          -e GITHUB_ACTIONS -e GITHUB_STEP_SUMMARY=/github/step_summary
          -v "$GITHUB_STEP_SUMMARY:/github/step_summary" -e "TEST_NAME=Smoke test on Alpine (musl)"
          alpine:latest
          sh -c 'apk add -q bash && bash build/test-ffmpeg.sh _out/ffmpeg-${{ matrix.platform }}-v*[0-9]'

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: _out/
          if-no-files-found: error

  publish:
    needs: build
    uses: ./.github/workflows/check-and-publish.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      artifact-pattern: ffmpeg-*
      publish: ${{ inputs.publish }}
      title: ffmpeg binaries built from source
      tag-prefix: ffmpeg-build
      max-macos: "11.0"